[project]
name = "weather-predictions"
version = "0.1.0"
description = "NOAA/NWS-based weather data collection, training, and precipitation forecasting"
authors = [
    {name = "hiemenz",email = "kevinhiemenz1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "typer (>=0.26.8,<0.27.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[project.scripts]
weather = "weather_predictions.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]
# Radar decoding only: Py-ART pulls in Cartopy, which has no prebuilt ARM wheels.
# The Pi only downloads raw scans; decode where this group is installed
# (`uv sync --group radar`).
radar = ["arm-pyart>=2.2.4,<3"]
# Nowcasting (optical flow) and e-ink rendering; installs fine on a Pi
# (`uv sync --group display`).
display = ["opencv-python-headless>=4.12.0.88,<5", "pillow>=11.3.0,<12"]
# Web dashboard: FastAPI + Jinja2 served from the Pi.
web = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0", "jinja2>=3.1.0"]
# ConvLSTM learned nowcasting (PyTorch; MPS on Apple Silicon). CPU inference works on the Pi without it.
convlstm = ["torch>=2.3.0"]
# MRMS national radar composite decoding: cfgrib wraps the eccodes C library for GRIB2.
# eccodes must be installed separately (macOS: brew install eccodes; Debian: apt install libeccodes-dev).
# Mac-only in practice; the Pi only displays grids fetched elsewhere.
mrms = ["cfgrib>=0.9.15,<0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_predictions"]
